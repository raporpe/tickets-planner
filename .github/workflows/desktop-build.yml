name: Desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tickets-planner-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
