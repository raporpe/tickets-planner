name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-15-intel
            target: aarch64-apple-darwin
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.platform }}
      - run: npm ci
      - run: npm run desktop:test
      - name: Build signed Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: Stage release files
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT="dist-release/${{ matrix.platform }}"
          mkdir -p "$OUT"
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            cp "$BUNDLE/nsis/"*-setup.exe "$OUT/Tickets.planner_${VER}_x64-setup.exe"
            cp "$BUNDLE/nsis/"*-setup.exe.sig "$OUT/Tickets.planner_${VER}_x64-setup.exe.sig"
          elif [ "${{ matrix.platform }}" = "darwin-aarch64" ]; then
            cp "$BUNDLE/dmg/"*.dmg "$OUT/Tickets.planner_${VER}_aarch64.dmg"
            cp "$BUNDLE/macos/"*.app.tar.gz "$OUT/Tickets.planner_${VER}_aarch64.app.tar.gz"
            cp "$BUNDLE/macos/"*.app.tar.gz.sig "$OUT/Tickets.planner_${VER}_aarch64.app.tar.gz.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: app/dist-release/${{ matrix.platform }}/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate latest.json and publish to Azure Blob Storage and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          VER=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          TAG="v${VER}"
          BASE="https://stticketsplanner9284.blob.core.windows.net/releases/${TAG}"
          WIN_SIG=$(cat "artifacts/Tickets.planner_${VER}_x64-setup.exe.sig")
          ARM_SIG=$(cat "artifacts/Tickets.planner_${VER}_aarch64.app.tar.gz.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          node -e '
            const fs = require("node:fs");
            const [ver, base, pubDate, winSig, armSig] = process.argv.slice(1);
            const manifest = {
              version: ver,
              notes: `Tickets planner v${ver}`,
              pub_date: pubDate,
              platforms: {
                "windows-x86_64": {
                  signature: winSig.trim(),
                  url: `${base}/Tickets.planner_${ver}_x64-setup.exe`
                },
                "darwin-aarch64": {
                  signature: armSig.trim(),
                  url: `${base}/Tickets.planner_${ver}_aarch64.app.tar.gz`
                }
              }
            };
            fs.writeFileSync("artifacts/latest.json", JSON.stringify(manifest, null, 2));
          ' "$VER" "$BASE" "$PUB_DATE" "$WIN_SIG" "$ARM_SIG"
          cat artifacts/latest.json
          az storage blob upload-batch --destination releases --destination-path "$TAG" --source artifacts --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --overwrite true
          az storage blob upload --container-name releases --name "Tickets-planner-setup-x64.exe" --file "artifacts/Tickets.planner_${VER}_x64-setup.exe" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --overwrite true
          az storage blob upload --container-name releases --name "Tickets-planner-macos-arm64.dmg" --file "artifacts/Tickets.planner_${VER}_aarch64.dmg" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --overwrite true
          az storage blob upload --container-name releases --name "latest.json" --file artifacts/latest.json --content-type application/json --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --overwrite true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Tickets planner v${VER}" --notes "Signed Windows (x64) and macOS (Apple Silicon) release deployed to Azure Blob Storage."
          fi
